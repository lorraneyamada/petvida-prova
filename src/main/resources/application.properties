spring.application.name=petvida

# Banco H2 em memoria
spring.datasource.url=jdbc:h2:mem:petvida;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console web do H2 (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Linhas obrigatorias da prova (usadas como evidencia nas Partes C e F)
logging.level.web=trace
spring.thymeleaf.cache=false